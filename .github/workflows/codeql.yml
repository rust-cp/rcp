name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # Release readiness needs the same complete query set on PRs and main.
    # Supported by the pinned action's Feature.DiffInformedQueries control.
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload results to code scanning
      contents: read
      actions: read # read workflow run metadata for the actions analysis
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          upload: always
          output: ${{ runner.temp }}/codeql-results
      - name: Check actual analysis findings
        run: python3 scripts/check-codeql-results.py "$RUNNER_TEMP/codeql-results"
      - name: Preserve analysis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          retention-days: 7
          if-no-files-found: error
