name: Fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "11 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: C++ toolchain for libFuzzer
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Run each parser target
        run: scripts/fuzz.sh "$FUZZ_SECONDS"
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '120' || '20' }}
