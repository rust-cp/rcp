name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  # The same release, started by hand on main: the run checks main is that release, makes the
  # tag on it and goes on. It exists because a tag pushed by a workflow's own token starts no
  # other workflow, so a separate tagging job could not set this one off.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as in Cargo.toml (e.g. 0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Staged outside the checkout, so publish.sh sees the tree as clean.
  DIST: ${{ github.workspace }}/../dist

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    permissions:
      contents: write # create the tag on a manual run, the GitHub release and its assets
      packages: write # push the image and the binary to ghcr.io
      id-token: write # keyless Sigstore signing and build provenance
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actions/attest refuses a subject path containing '..', so it gets the resolved form.
      - name: Resolve the staging directory
        id: dist
        run: echo "path=$(realpath -m "$DIST")" >> "$GITHUB_OUTPUT"

      - name: The tag must match the crate version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$crate" = "$TAG" ] || { echo "tag $TAG does not match Cargo.toml version $crate" >&2; exit 1; }

      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Test peers
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zstd krb5-kdc krb5-admin-server krb5-user libgssapi-krb5-2
          python3 -m pip install --user --require-hashes -r tests/support/requirements.txt

      - name: Test release license collection
        run: python3 -m unittest discover -s scripts -p test_third_party_licenses.py

      - run: cargo test --locked --features rustls
        env:
          RCP_REQUIRE_KDC: "1"

      - name: Build the GNU/Linux binary
        run: |
          mkdir -p "$DIST/baseline"
          docker run --rm --mount "type=bind,source=$PWD,target=/src,readonly" --mount "type=bind,source=$DIST/baseline,target=/output" -w /src \
            docker.io/library/rust@sha256:ba3a8b9eb24de14c1879efe8acff7d4eb747723ca957e0d2409d0bc2ea9f84a7 \
            bash -c 'set -euo pipefail; bash scripts/build-gnu.sh /output'
          bin="$DIST/baseline/rcp"
          file "$bin" | grep -q 'dynamically linked' || { echo "binary must use the system GNU libc" >&2; exit 1; }
          "$bin" version
          name="rcp-$TAG-x86_64-unknown-linux-gnu"
          mkdir -p "$DIST/$name" && cp "$bin" LICENSE README.md "$DIST/$name/"
          printf 'GNU/Linux x86-64, dynamically linked to system GNU libc.\nMaximum required GNU libc ABI: 2.34 (enforced at build time).\nBuilder: official Rust 1.90.0/Bullseye, digest sha256:ba3a8b9eb24de14c1879efe8acff7d4eb747723ca957e0d2409d0bc2ea9f84a7.\nKerberos requires the system GSSAPI library.\n' > "$DIST/$name/RUNTIME.txt"
          printf '\nRequired GNU libc symbol versions:\n' >> "$DIST/$name/RUNTIME.txt"
          objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu >> "$DIST/$name/RUNTIME.txt"
          cp "$DIST/baseline/THIRD_PARTY_LICENSES.txt" "$DIST/$name/"
          python3 scripts/spdx-sbom.py --metadata "$DIST/baseline/cargo-metadata.json" \
            --namespace "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}.tar.gz.spdx.json" \
            --output "$DIST/$name/SBOM.spdx.json"
          tar -C "$DIST" -czf "$DIST/$name.tar.gz" "$name"
          cp "$DIST/$name/SBOM.spdx.json" "$DIST/$name.tar.gz.spdx.json"
          cp "$bin" "$DIST/rcp"
          ( cd "$DIST" && sha256sum "$name.tar.gz" "$name.tar.gz.spdx.json" > SHA256SUMS )

      - name: Verify GLIBC 2.34 runtime and dynamic GSSAPI
        run: |
          docker build -f container/compatibility-test.Dockerfile -t localhost/rcp-glibc-test .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --env RCP_EXPECTED_VERSION="${TAG#v}" \
            --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" --mount "type=bind,source=$DIST/baseline,target=/input,readonly" \
            localhost/rcp-glibc-test python3 /scripts/glibc-runtime-smoke.py /input/rcp > "$DIST/baseline/glibc-runtime-smoke.json"

      - name: Verify the packaged release
        run: python3 scripts/release-smoke.py "$DIST" "$TAG"

      - name: Tag this commit (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "run this on main, not $GITHUB_REF" >&2; exit 1; }
          scripts/release.sh check "${TAG#v}" HEAD
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="rcp ${TAG#v}" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag" --silent
          echo "tagged $TAG at $GITHUB_SHA"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signatures: cosign authenticates with this job's OIDC identity, so the
      # signing certificate names this workflow, and the signature is logged in Rekor.
      - name: Sign the release archives
        run: |
          for f in "$DIST"/*.tar.gz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.dist.outputs.path }}/*.tar.gz
            ${{ steps.dist.outputs.path }}/*.spdx.json

      - name: Release notes from CHANGELOG.md
        run: |
          version=${TAG#v}
          awk -v v="$version" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            /^\[[^]]+\]: / { exit }
            on' CHANGELOG.md > "$DIST/NOTES.md"
          [ -s "$DIST/NOTES.md" ] || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }

      - name: Build and test the container image
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rcp"
          python3 scripts/build-container.py --binary "$DIST/baseline/rcp" \
            --notices "$DIST/baseline/THIRD_PARTY_LICENSES.txt" \
            --image "$image:${TAG#v}" --version "${TAG#v}" --revision "$GITHUB_SHA"
          cc -Wall -Wextra -Werror container/hardening-probe.c -o "$RUNNER_TEMP/rcp-probe"
          python3 scripts/container-smoke.py --image "$image:${TAG#v}" --probe "$RUNNER_TEMP/rcp-probe" \
            --output "$RUNNER_TEMP/container-smoke"
          scripts/install-ci-tool.sh syft
          syft scan "docker:$image:${TAG#v}" -o "spdx-json=$DIST/container.spdx.json"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$DIST/rcp.sigstore.json"
          python3 scripts/sigstore-intoto.py "$BUNDLE" "$DIST/rcp.intoto.jsonl"
          assets=("$DIST"/*.tar.gz "$DIST"/*.tar.gz.spdx.json "$DIST"/*.tar.gz.sigstore.json \
            "$DIST/SHA256SUMS" "$DIST/rcp.sigstore.json" "$DIST/rcp.intoto.jsonl")
          prerelease=; case "$TAG" in *-*) prerelease=--prerelease;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "rcp ${TAG#v}" --notes-file "$DIST/NOTES.md" $prerelease "${assets[@]}"

      - name: Push the container image to GitHub Container Registry
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:${TAG#v}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${TAG#v}")
          digest=${digest#*@}
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the image and attest its SBOM
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate "$DIST/container.spdx.json" "$IMAGE@$DIGEST"

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Push the binary to GitHub Container Registry
        id: binary
        env:
          RCP_BIN: ${{ env.DIST }}/rcp
          RCP_BUILD_TARGET: x86_64-unknown-linux-gnu
          RCP_BUILD_REVISION: ${{ github.sha }}
          RCP_BUILD_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          ORAS_TOKEN: ${{ github.token }}
        run: |
          echo "$ORAS_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          RCP_BUILD_RUSTC=$(head -1 "$DIST/baseline/build-toolchain.txt")
          RCP_BUILD_VERSION=${TAG#v}
          export RCP_BUILD_RUSTC RCP_BUILD_VERSION
          bash scripts/publish.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rcp-binary" "${TAG#v}"

      - name: Sign the binary artifact
        env:
          TARGET: ${{ steps.binary.outputs.target }}
          DIGEST: ${{ steps.binary.outputs.digest }}
        run: cosign sign --yes "$TARGET@$DIGEST"
