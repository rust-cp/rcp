# OpenSSF Scorecard supply-chain analysis. Results are published to the public Scorecard
# API (https://scorecard.dev) and uploaded to code scanning.
name: scorecard

on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  schedule:
    - cron: "27 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

# Everything read-only by default; the analysis job asks for what it needs.
permissions: read-all

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # read workflow runs for the CI-Tests and SAST checks
      id-token: write # publish results to the Scorecard API
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard

  summary:
    name: summary
    needs: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Link the published result
        env:
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Scorecard"
            echo
            echo "Published result: https://scorecard.dev/viewer/?uri=github.com/${REPO}"
          } >> "$GITHUB_STEP_SUMMARY"
