# Both Kerberos pods read this. The KDC is the krb Service; names are used as written, with
# no DNS canonicalization, so the client asks for nfs/krb, the key the server holds. That
# takes qualify_shortname as well: since MIT 1.18 a name without a dot otherwise gets the
# first DNS search domain appended (nfs/krb.<namespace>.svc.cluster.local, which no KDC has).
[libdefaults]
    default_realm = RCP.INTEROP
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    dns_canonicalize_hostname = false
    qualify_shortname = ""
    udp_preference_limit = 1
[realms]
    RCP.INTEROP = {
        kdc = krb:88
    }
[domain_realm]
    krb = RCP.INTEROP
